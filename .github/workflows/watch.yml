name: watch-lich-bat-thuong

# Quét lịch học bất thường mỗi 15' trong giờ làm CS.
# Cron theo giờ UTC; VN = UTC+7 -> 00:00-16:00 UTC = 07:00-23:00 VN.
on:
  schedule:
    - cron: "*/15 0-16 * * *"
  workflow_dispatch: {}

concurrency:
  group: watch-lich
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python watch_schedule.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRM_ENCRYPT_KEY: ${{ secrets.CRM_ENCRYPT_KEY }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          WATCHLIST_JSON: ${{ secrets.WATCHLIST_JSON }}
