name: first-lesson-care

# Danh sách học viên mới cần chăm trước buổi học đầu tiên (chị Huyền).
# Quét mỗi 30' trong giờ làm CS. Cron UTC; VN = UTC+7 -> 01:30-15:00 UTC = 08:30-22:00 VN.
on:
  schedule:
    - cron: "30 1 * * *"          # 08:30 VN
    - cron: "0,30 2-14 * * *"     # 09:00–21:30 VN
    - cron: "0 15 * * *"          # 22:00 VN
  workflow_dispatch:
    inputs:
      seed_days:
        description: "Seed pool: gom bé đã mua trong N ngày (chạy tay 1 lần, vd 45). Để trống = chạy thường."
        required: false
        default: "0"

concurrency:
  group: first-lesson
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # seed quét ~522 bé; chạy thường (pool nhỏ) vài phút
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -u watch_first_lesson.py
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRM_ENCRYPT_KEY: ${{ secrets.CRM_ENCRYPT_KEY }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GOOGLE_SHEET_ID_FIRST: ${{ secrets.GOOGLE_SHEET_ID_FIRST }}
          FIRST_LESSON_ARRIVAL_DAYS: ${{ vars.FIRST_LESSON_ARRIVAL_DAYS }}
          FIRST_LESSON_SAME_BUY_MINUTES: ${{ vars.FIRST_LESSON_SAME_BUY_MINUTES }}
          FIRST_LESSON_POOL_MAX_DAYS: ${{ vars.FIRST_LESSON_POOL_MAX_DAYS }}
          FIRST_LESSON_SEED_DAYS: ${{ github.event.inputs.seed_days }}
